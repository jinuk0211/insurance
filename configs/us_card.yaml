# US credit card agreements from CFPB Credit Card Agreement Database.
# eval_US/ already has the E1-E4 scripts wired against this corpus.
domain: us_card
language: en
corpus: data/us_card_corpus
sample_size: 5
seed: 42

profile: data/profiles/us_default.json

primary_metric: composite

targets:
  stage1_kw_recall: 0.65
  stage2_findings_per_doc: 3.0
  stage3_mrr: 0.75
  citation_gate_drops_max: 0
